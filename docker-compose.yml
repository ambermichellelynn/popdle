services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: popdle
      POSTGRES_PASSWORD: popdle
      POSTGRES_DB: popdle
    ports:
      - "5432:5432"
    volumes:
      - popdle_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  popdle_postgres_data:
