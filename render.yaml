databases:
  - name: popdle-db
    plan: free
    databaseName: popdle
    user: popdle

services:
  - type: web
    name: popdle-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: popdle-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_BASE_URL
        value: https://popdle-frontend.onrender.com
      - key: TMDB_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false

  - type: web
    name: popdle-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://popdle-backend.onrender.com
